- Applications:
    - Navidrome:
        icon: navidrome
        href: https://navidrome.{{HOMEPAGE_VAR_DOMAIN}}
        description: Music
        siteMonitor: http://192.168.1.24:4533
        widget:
          type: navidrome
          url: http://192.168.1.24:4533
          user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"

    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies & TV
        siteMonitor: http://192.168.1.23:8096

    - Miniflux:
        icon: miniflux
        href: https://miniflux.{{HOMEPAGE_VAR_DOMAIN}}
        description: News feeds

    - Paperless:
        icon: paperless-ngx
        href: https://paperless.{{HOMEPAGE_VAR_DOMAIN}}
        description: Documents
        siteMonitor: http://192.168.1.24:8010

    - Actual Budget:
        icon: actual-budget
        href: https://budget.{{HOMEPAGE_VAR_DOMAIN}}
        description: Budgeting

    - Monica:
        icon: mdi-account-heart
        href: https://monica.{{HOMEPAGE_VAR_DOMAIN}}
        description: Contacts & relationships

    - Gramps:
        icon: mdi-family-tree
        href: https://gramps.{{HOMEPAGE_VAR_DOMAIN}}
        description: Family tree

- Containers & Other:
    - Portainer:
        icon: portainer
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
        description: Docker on .24
        siteMonitor: https://192.168.1.24:9443

    - Dozzle:
        icon: dozzle
        href: https://dozzle.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container logs

    - Home Assistant:
        icon: home-assistant
        href: https://homeassistant.{{HOMEPAGE_VAR_DOMAIN}}
        description: Smart home
        siteMonitor: http://192.168.1.22:8123

    - Uptime Kuma:
        icon: uptime-kuma
        href: https://kuma.{{HOMEPAGE_VAR_DOMAIN}}
        description: Up/down checks
        widget:
          type: uptimekuma
          url: http://192.168.1.17:3001
          slug: applications

    - Glances:
        icon: glances
        href: https://glances.{{HOMEPAGE_VAR_DOMAIN}}
        description: System stats

- Proxmox:
    - Node:
        - pve-01:
            icon: proxmox
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Hypervisor
            widget:
              type: proxmox
              url: https://192.168.1.150:8006
              node: pve-01
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"

    - Children:
        - caddy LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Reverse proxy
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 106
        - fileshare LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Exposes mounted folders for file management
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 107
        - docker LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Hosts applications
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 103
        - adguard LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Primary DNS server
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 104
        - jellyfin LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Media server with iGPU passthrough
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 100
        - dashboards LXC:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Hosts dashboards and observability services
            proxmoxNode: pve-01
            proxmoxType: lxc
            proxmoxVMID: 108
        - Home Assistant VM:
            href: https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}
            description: Home automation
            proxmoxNode: pve-01
            proxmoxVMID: 102

- Network:
    - AdGuard:
        icon: adguard-home
        href: https://adguard.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS
        siteMonitor: http://192.168.1.20:80
        widget:
          type: adguard
          url: http://192.168.1.20:80
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

    - Router:
        icon: mdi-router-wireless
        href: https://router.{{HOMEPAGE_VAR_DOMAIN}}
        description: Gateway
