- Applications:
    - Navidrome:
        icon: navidrome
        href: https://navidrome.{{HOMEPAGE_VAR_DOMAIN}}
        description: Music
        siteMonitor: http://192.168.1.24:4533
        widget:
          type: navidrome
          url: http://192.168.1.24:4533
          user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"

    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies & TV
        siteMonitor: http://192.168.1.23:8096

    - Miniflux:
        icon: miniflux
        href: https://miniflux.{{HOMEPAGE_VAR_DOMAIN}}
