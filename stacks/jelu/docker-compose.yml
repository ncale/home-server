services:
  jelu:
    image: wabayang/jelu
    restart: unless-stopped
    ports:
      - "11111:11111"
    environment:
      - TZ=America/Chicago
    volumes:
      - jelu-config:/config
      - jelu-database:/database
      - jelu-images:/files/images
      - jelu-imports:/files/imports

volumes:
  jelu-config:
  jelu-database:
  jelu-images:
  jelu-imports:
