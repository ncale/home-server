services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    image: jupyter/scipy-notebook:latest
    restart: unless-stopped
    user: root
    environment:
      - JUPYTER_ENABLE_LAB=yes # use JupyterLab UI instead of classic
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - CHOWN_HOME=yes
      - CHOWN_EXTRA=/home/jovyan/work
      - CHOWN_HOME_OPTS=-R
      - GRANT_SUDO=yes
      - NB_UID=1000
      - NB_GID=1000
    volumes:
      - /opt/worlddb:/home/jovyan/work
    ports:
      - "8800:8888"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: