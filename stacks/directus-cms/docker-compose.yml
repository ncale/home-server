# See https://directus.io/docs/getting-started/create-a-project#docker-compose
services:
  directus:
    image: directus/directus:11.14.1
    ports:
      - "${PORT:-8055}:8055"
    volumes:
      - ${DATA_PATH:-/root/directus}/database:/directus/database
      - ${DATA_PATH:-/root/directus}/uploads:/directus/uploads
      - ${DATA_PATH:-/root/directus}/extensions:/directus/extensions
    environment:
      SECRET: ${SECRET}
      DB_CLIENT: ${DB_CLIENT}
      DB_FILENAME: ${DB_FILENAME}
      WEBSOCKETS_ENABLED: "true"
